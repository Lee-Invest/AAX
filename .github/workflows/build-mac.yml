name: Build macOS Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - claude/dreamy-feynman-7q4awm

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Re-sign with ad-hoc signature
        run: |
          codesign --force --deep -s - "build/BrightonRig_artefacts/AU/Brighton Rig.component"
          codesign --force --deep -s - "build/BrightonRig_artefacts/VST3/Brighton Rig.vst3"
          codesign --force --deep -s - "build/BrightonRig_artefacts/Standalone/Brighton Rig.app"
          codesign -dv --verbose=2 "build/BrightonRig_artefacts/Standalone/Brighton Rig.app"

      - name: Package
        run: |
          cd build/BrightonRig_artefacts
          ditto -c -k --sequesterRsrc --keepParent "AU/Brighton Rig.component" AU-BrightonRig.zip
          ditto -c -k --sequesterRsrc --keepParent "VST3/Brighton Rig.vst3" VST3-BrightonRig.zip
          ditto -c -k --sequesterRsrc --keepParent "Standalone/Brighton Rig.app" Standalone-BrightonRig.zip
          mkdir -p package/AU package/VST3 package/Standalone
          mv AU-BrightonRig.zip package/AU/
          mv VST3-BrightonRig.zip package/VST3/
          mv Standalone-BrightonRig.zip package/Standalone/
          cd package
          zip -r ../BrightonRig-macOS.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightonRig-macOS
          path: build/BrightonRig_artefacts/BrightonRig-macOS.zip

      - name: Publish build to dist branch
        run: |
          mkdir -p /tmp/dist-branch
          cp build/BrightonRig_artefacts/BrightonRig-macOS.zip /tmp/dist-branch/
          cd /tmp/dist-branch
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b dist-macos
          git add BrightonRig-macOS.zip
          git commit -q -m "macOS build ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin dist-macos
