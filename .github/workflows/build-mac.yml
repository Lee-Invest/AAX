name: Build macOS Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - claude/dreamy-feynman-7q4awm

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package
        run: |
          cd build/SimpleVerb_artefacts
          zip -r SimpleVerb-macOS.zip AU VST3 Standalone

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVerb-macOS
          path: build/SimpleVerb_artefacts/SimpleVerb-macOS.zip

      - name: Publish build to dist branch
        run: |
          mkdir -p /tmp/dist-branch
          cp build/SimpleVerb_artefacts/SimpleVerb-macOS.zip /tmp/dist-branch/
          cd /tmp/dist-branch
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b dist-macos
          git add SimpleVerb-macOS.zip
          git commit -q -m "macOS build ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin dist-macos
